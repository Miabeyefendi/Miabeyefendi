# Renders the contribution calendar as isometric blocks. Ten variants are
# produced; the README uses the night rainbow and the block build. Output is
# committed, so nothing is fetched at view time.
#
# Manual, one-shot only: no schedule, so it never loops against the GitHub API.
# Run it by hand from the Actions tab when the graph needs refreshing.
name: 3D contribution graph

on:
  workflow_dispatch:

concurrency:
  group: 3d-contrib
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh the 3D contribution graph"
          file_pattern: profile-3d-contrib/*
