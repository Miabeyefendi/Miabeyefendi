# Renders the contribution calendar as isometric blocks. Ten variants are
# produced; the README uses the night rainbow and the block build. Output is
# committed, so nothing is fetched at view time.
name: 3D contribution graph

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh the 3D contribution graph"
          file_pattern: profile-3d-contrib/*
