# Generates the contribution snake and commits the SVG into this repository.
# The page then loads a file that lives here, so it keeps working even if the
# action is never run again.
name: Snake

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # git-auto-commit needs a checked out repository to commit into.
      - uses: actions/checkout@v4

      - name: Generate
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-light
            assets/snake-dark.svg?palette=github-dark
            assets/snake.gif?color_snake=#A78BFA&color_dots=#0B0E14,#1E293B,#0EA5E9,#A78BFA,#22C55E

      - name: Commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh the contribution snake"
          file_pattern: assets/snake*
